# main への push と PR で、型チェックとテストを走らせる(Windows のビルドはしない)
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Rust の守りのテスト(リダイレクトでトークンを渡さない・画面に許す口・Cookie と POST の共通ケースなど)。
  # Linux には鍵保管(Secret Service)がないので、同期の鍵のテストは「使えない」と返すところまでを確かめる
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      # tauri の generate_context が画面の成果物(dist)を読むので、先に作る
      - run: npm run build -w @bbs-browser/desktop
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib --locked

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 単体テスト(packages/conformance の共通のケースを含む)
        working-directory: apps/android
        run: bash gradlew testDebugUnitTest --console=plain
      # R8 を通した配布用のビルドが壊れていないかも見る(keystore.properties がないので署名は開発用の鍵。配るものではない)
      - name: 配布用ビルド
        working-directory: apps/android
        run: bash gradlew assembleRelease --console=plain
