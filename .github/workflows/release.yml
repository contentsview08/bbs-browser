# 版の印(タグ v0.2.0 など)を push すると、Windows でビルドして、インストーラー(setup.exe・msi)と ZIP 版を
# GitHub の Releases に「下書き」として置く。中身を確かめてから、Releases の画面で公開する。
# Actions の画面から手で走らせることもできる(workflow_dispatch。そのときは Releases には置かず、成果物だけ残す)
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Rust の版は rust-toolchain.toml に固定してある(rustup が読んで合わせる)
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm run package:zip
      - uses: actions/upload-artifact@v4
        with:
          name: BBSN-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/zip/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # リリース文は docs/releases/<タグ>.md(なければ空)
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/zip/*.zip
