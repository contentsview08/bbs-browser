# 版の印(タグ v0.2.0 など)を push すると、Windows(setup.exe・ZIP)と Linux(.deb・AppImage)をビルドして、自動更新の latest.json と署名と一緒に
# GitHub の Releases に「下書き」として置く。中身を確かめてから、Releases の画面で公開する。
# Actions の画面から手で走らせることもできる(workflow_dispatch。そのときは Releases には置かず、成果物だけ残す)
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 書き込みが要るのは、下書きを置く release のジョブだけ
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Rust の版は rust-toolchain.toml に固定してある(rustup が読んで合わせる)
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      # 自動更新の署名。鍵がなければここで失敗する(署名のない版を配らない)。鍵にパスワードは付けていない。
      # MSI は配らない(自動更新は NSIS の setup.exe を流すので、MSI で入れた人に 2 つ目が入る)
      # Google の同期のクライアント(src-tauri/build.rs が読む)。なければ Google の同期のないビルドになり、同期サーバーのまま動く
      - run: npm run build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          OBB_GOOGLE_CLIENT_ID: ${{ secrets.OBB_GOOGLE_CLIENT_ID }}
          OBB_GOOGLE_CLIENT_SECRET: ${{ secrets.OBB_GOOGLE_CLIENT_SECRET }}
      - run: npm run package:zip
      - uses: actions/upload-artifact@v4
        with:
          name: OBB-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/zip/*.zip

  linux:
    needs: test
    # 22.04 は WebKitGTK の更新が止まっているので、24.04 で作る(Ubuntu 24.04 以降・同じ世代の Linux で動く)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf libfuse2t64 xdg-utils
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build -- --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          OBB_GOOGLE_CLIENT_ID: ${{ secrets.OBB_GOOGLE_CLIENT_ID }}
          OBB_GOOGLE_CLIENT_SECRET: ${{ secrets.OBB_GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: OBB-linux
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  # 両方のビルドが通ったときだけ、まとめて下書きに置く
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: apps/desktop/src-tauri/target/release/bundle
      - run: node scripts/make-latest-json.mjs
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          # リリース文は docs/releases/<タグ>.md(なければ空)
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/zip/*.zip
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/latest.json
