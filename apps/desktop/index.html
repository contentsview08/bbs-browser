<!doctype html>
<html lang="ja" class="dark" data-scheme="indigo" data-pattern="tonal" data-density="dense">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 画像や動画を読み込むときに、アプリのページから来たこと(Referer)を送らない。
         X の動画(video.twimg.com)などは、ほかのサイトから来た読み込みを 403 で断るため。
         <video> には要素ごとの指定がないので、ページ全体で決める。YouTube の埋め込みは要るので iframe に個別に付けてある -->
    <meta name="referrer" content="no-referrer" />
    <title>OBB</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
