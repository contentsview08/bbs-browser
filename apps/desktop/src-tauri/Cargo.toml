[package]
name = "bbs-browser"
version = "0.1.0"
description = "コネクタで掲示板を読む専用ブラウザ"
edition = "2021"

[lib]
# Windows で bin と lib の名前がぶつからないよう _lib を付ける(Tauri テンプレートの慣習)
name = "bbs_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# unsafe-headers: User-Agent などを JS から設定するため / cookies: 書き込み対応に備えて
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
