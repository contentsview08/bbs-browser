[package]
name = "bbs-browser"
version = "0.1.2"
description = "コネクタで掲示板を読む専用ブラウザ"
edition = "2021"

[lib]
# Windows で bin と lib の名前がぶつからないよう _lib を付ける(Tauri テンプレートの慣習)
name = "bbs_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: 背景画像(アプリのデータフォルダにコピーしたもの)を画面から読むため
tauri = { version = "2", features = ["protocol-asset"] }
# unsafe-headers: User-Agent などを JS から設定するため / cookies: 書き込み対応に備えて
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "cookies"] }
# 画像の保存先フォルダを選ぶ
tauri-plugin-dialog = "2"
# 本文中の URL を既定のブラウザで開く
tauri-plugin-opener = "2"
# スマホ: お気に入りのスレの新着などを、OS の通知で知らせる
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# OS に入っているフォントの一覧(設定のフォント選び)
fontdb = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 書き込みの Cookie を自分で持つ(post_http.rs)。plugin-http が使っているものと同じ版。
# どの OS でも使うので、Windows だけの依存(下)には入れない(入れると Android・Linux でビルドできない)
cookie_store = "0.22"
# 更新のインストーラーを落とす(update.rs)。plugin-http が使っているものと同じ
reqwest = "0.12"

# 起動時の自動更新(署名を確かめて入れ替える)と、入れ替えた後の再起動。パソコンの版だけ
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# WebView2 の設定を直接変える(F5 などのブラウザのショートカットを切る)。版は tauri(wry)が使っているものに合わせる
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
