[package]
name = "bbs-browser"
version = "0.1.6"
description = "コネクタで掲示板を読む専用ブラウザ"
edition = "2021"

[lib]
# Windows で bin と lib の名前がぶつからないよう _lib を付ける(Tauri テンプレートの慣習)
name = "bbs_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: 背景画像(アプリのデータフォルダにコピーしたもの)を画面から読むため
tauri = { version = "2", features = ["protocol-asset"] }
# unsafe-headers: User-Agent などを JS から設定するため / cookies: 読む通信の Cookie を持つため
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "cookies"] }
# ファイル・フォルダを選ぶ画面
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# OS の通知
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# sql_batch のトランザクション。tauri-plugin-sql が使っているものと同じ版
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "json", "runtime-tokio"] }
fontdb = "0.24"
# 置き場の窓から来たリンクがサイトの形に合うかを確かめる(web_upload.rs)。tauri の依存にあるものと同じ版
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 書き込みの Cookie を自分で持つ(post_http.rs)。plugin-http が使っているものと同じ版。
# どの OS でも使うので、Windows だけの依存(下)には入れない(入れると Android・Linux でビルドできない)
cookie_store = "0.22"
# 同期の通信(sync_http.rs)。plugin-http が使っているものと同じ
reqwest = "0.12"
# 同期の鍵を OS の鍵保管に置く(sync_key.rs)。使う OS の分だけ、下の target に足す
keyring-core = "1"
# 画像のキャッシュのファイル名(URL のハッシュ)と同期の鍵の名前(置き場のハッシュ)。tauri が使っているものと同じ版
sha2 = "0.10"
# 画像のキャッシュの同時数・取り消し・名前を引いた先の確かめ(net)・Google のログインのループバックの口(io-util)。tauri が使っているものと同じ版
tokio = { version = "1", features = ["sync", "macros", "time", "net", "io-util"] }
# Google のログイン(google_auth.rs)の PKCE と state の乱数・Base64URL。Cargo.lock にあるものと同じ版
getrandom = "0.3"
base64 = "0.22"

# 自動更新。パソコンの版だけ
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 描画のプロセスが落ちたことを受け取る。版は tauri(wry)が使っているものに合わせる
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
# Secret Service。libdbus が要らない方(Rust だけで動く)
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# WebView2 の設定を直接変える(F5 などのブラウザのショートカットを切る)。版は tauri(wry)が使っているものに合わせる
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
webview2-com = "0.39"
windows-core = "0.62"
