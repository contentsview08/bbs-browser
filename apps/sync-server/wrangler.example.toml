# 例のファイル。写して wrangler.toml にして使う(wrangler.toml はコミットしない)。アカウント ID と秘密は書かない
# 秘密は wrangler secret で入れる: POW_SECRET、ADMIN_KEYS、TURNSTILE_SECRET、TICKET_KEYS
# TICKET_KEYS は { "鍵 ID": "32 バイト以上の Base64URL" } の JSON。署名に使う鍵 ID は TICKET_KID。環境ごとに別の鍵にする
# 既定の値は省略できる。一覧は src/config.ts
name = "obb-sync"
main = "src/index.ts"
compatibility_date = "2026-03-01"
workers_dev = false

[vars]
SPACE_LIMIT = "100"
TICKET_KID = "k1"
# 端末へ「最低これだけ空ける」と指示する秒(確認・送信)。0 は指示しない(端末の既定: 確認 60 秒、変化なしで 2 倍ずつ最大 5 分、送信 120 秒)
# 端末の既定(確認 60 秒〜5 分、送信 5 分)より短い値は効かない。Workers Free で要求が上限に近づいたら PACE_HEAD_SEC = "300" で確認を 5 分に固定できる
PACE_HEAD_SEC = "0"
PACE_PUSH_SEC = "0"
# 領域ごとの 1 日の回数。既定 6000 は Paid 向け。Free で 100 人なら 1 人 1,000 要求に収めるため "1200" 程度に下げる(docs/sync-design.md の費用)
# RATE_PER_DAY = "1200"
# 実際のウィジェットのサイトキーを入れて使う
TURNSTILE_SITEKEY = ""

[[durable_objects.bindings]]
name = "SPACE"
class_name = "SpaceDO"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpaceDO", "LedgerDO"]

# IP ごとの制限。周期は 10 秒か 60 秒だけ。namespace_id はアカウントの中で重ならない数字
# RL_IP の根拠: 端末は確認 60 秒・送信 120 秒なので 1 台で 1 分に多くて 3 回(head・changes・records)、前面復帰の直後に数回まとまる。
# 家の PC + スマホは同じ IP から来るので 2 台分 + 復帰のまとまりで 30。CGNAT で多くの利用者が同じ IPv4 を共有する回線が多ければ上げる
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_WIDE"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_CREATE"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_TICKET"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

# 検証用。workers.dev に出す。枠 2 の手動のテストは SPACE_LIMIT を 2 にして出す
[env.verify]
name = "obb-sync-verify"
workers_dev = true

[env.verify.vars]
SPACE_LIMIT = "100"
# 開発で何度も作り直すので、同じ作成元の上限を緩める
SOURCE_LIMIT = "1000"
# 試運転は 15 秒ごとに同期するので、領域ごとの上限を広げる(2 台で 1 分に最大 16 回)
RATE_PER_MINUTE = "60"
RATE_PER_DAY = "20000"
POW_BITS = "16"
TICKET_KID = "k1"
# Cloudflare の公式のテスト用のキー(文書: turnstile/troubleshooting/testing)。誰でも通るので検証用の環境だけで使う
#   サイトキー  必ず通る 1x00000000000000000000AA / 必ず失敗 2x00000000000000000000AB / 操作を求める 3x00000000000000000000FF
#   秘密        必ず通る 1x0000000000000000000000000000000AA / 必ず失敗 2x0000000000000000000000000000000AA / 使用済み 3x0000000000000000000000000000000AA
#   秘密は wrangler secret put TURNSTILE_SECRET --env verify で入れる
# テスト用の秘密の応答は hostname が example.com で action がないので、次の印のある環境でだけ、この 2 つを確かめずに受け付ける
# 実際のウィジェットにしたら、サイトキーと秘密を入れ替えて TURNSTILE_TEST_KEYS を消す
TURNSTILE_SITEKEY = "1x00000000000000000000AA"
TURNSTILE_TEST_KEYS = "1"

[[env.verify.durable_objects.bindings]]
name = "SPACE"
class_name = "SpaceDO"

[[env.verify.durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[env.verify.ratelimits]]
name = "RL_IP"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[env.verify.ratelimits]]
name = "RL_WIDE"
namespace_id = "2002"
simple = { limit = 600, period = 60 }

[[env.verify.ratelimits]]
name = "RL_AUTH"
namespace_id = "2003"
simple = { limit = 30, period = 60 }

[[env.verify.ratelimits]]
name = "RL_CREATE"
namespace_id = "2004"
simple = { limit = 10, period = 60 }

[[env.verify.ratelimits]]
name = "RL_ADMIN"
namespace_id = "2005"
simple = { limit = 60, period = 60 }

[[env.verify.ratelimits]]
name = "RL_TICKET"
namespace_id = "2006"
simple = { limit = 10, period = 60 }
